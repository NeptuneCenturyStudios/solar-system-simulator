<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Spiraling Particle Wormhole</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            z-index: 10;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="info">Drag to rotate • Scroll to zoom</div>
    <script>
        // Basic setup
        const scene = new THREE.Scene();
        // Add a subtle fog to make the distance fade out like deep space
        scene.fog = new THREE.FogExp2(0x000000, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Position camera to look down into the wormhole
        camera.position.set(0, 30, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        // Use additive blending for a glowing effect
        renderer.setClearColor(0x000000, 1);
        document.body.appendChild(renderer.domElement);

        // OrbitControls for interactivity
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 150;
        controls.minDistance = 10;
        
        // Target slightly below the opening to keep it centered
        controls.target.set(0, -20, 0);

        // Wormhole parameters
        const particleCount = 50000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        const sizes = new Float32Array(particleCount);

        const colorInside = new THREE.Color(0xffffff); // Bright white core
        const colorMid = new THREE.Color(0x3366ff);    // Bright blue
        const colorOuter = new THREE.Color(0xcc33ff);   // Purple/pink outer edges
        
        // Calculate positions for a funnel/wormhole shape
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            
            // Parametric equations for a spiraling funnel
            // t goes from 0 (bottom tip) to 1 (wide opening)
            const t = Math.random();
            
            // Depth of the wormhole (Y axis) goes from -80 to 20
            const y = (t * 100) - 80;
            
            // Radius increases as it goes up, creating the funnel shape
            // Using a curve like t^2 or t^3 makes it flare out sharply at the top like in the image
            const radiusBase = Math.pow(t, 2.5) * 80;
            
            // Add some randomness to the radius to make it look like a thick cloud of particles
            const radius = radiusBase + (Math.random() - 0.5) * (t * 15 + 2);

            // Angle for the spiral
            // The deeper it goes (smaller t), the tighter the spiral
            const angle = (Math.random() * Math.PI * 2) + (y * 0.1);

            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            positions[i3] = x;
            positions[i3 + 1] = y;
            positions[i3 + 2] = z;

            // Color interpolation based on depth (t) and radius
            const mixedColor = new THREE.Color();
            
            if (t < 0.2) {
                // Deep inside: very bright, white/light blue
                mixedColor.lerpColors(colorInside, colorMid, t / 0.2);
            } else if (t < 0.7) {
                // Middle section: blue to purple
                mixedColor.lerpColors(colorMid, colorOuter, (t - 0.2) / 0.5);
            } else {
                // Outer rim: fading out, maybe adding some darker blues
                mixedColor.lerpColors(colorOuter, new THREE.Color(0x001133), (t - 0.7) / 0.3);
            }
            
            // Add a little randomness to individual particle colors
            mixedColor.r += (Math.random() - 0.5) * 0.2;
            mixedColor.g += (Math.random() - 0.5) * 0.2;
            mixedColor.b += (Math.random() - 0.5) * 0.2;

            colors[i3] = mixedColor.r;
            colors[i3 + 1] = mixedColor.g;
            colors[i3 + 2] = mixedColor.b;

            // Varied sizes, larger near the top opening
            sizes[i] = Math.random() * (t * 2 + 0.5);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        // Custom shader for better looking particles (soft edges)
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0.0 }
            },
            vertexShader: `
                attribute float size;
                attribute vec3 color;
                varying vec3 vColor;
                uniform float time;
                
                void main() {
                    vColor = color;
                    
                    vec3 pos = position;
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    // Attenuate size based on distance
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                
                void main() {
                    // Create a soft circle for the particle
                    vec2 xy = gl_PointCoord.xy - vec2(0.5);
                    float ll = length(xy);
                    
                    // Discard pixels outside the circle
                    if(ll > 0.5) discard;
                    
                    // Soft glow effect
                    float alpha = smoothstep(0.5, 0.1, ll);
                    
                    gl_FragColor = vec4(vColor, alpha);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false, // Prevents particles from occluding each other weirdly
        });

        // The entire particle system
        const wormhole = new THREE.Points(geometry, material);
        scene.add(wormhole);

        // Add some background stars for context
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starsPositions = new Float32Array(starsCount * 3);
        
        for(let i=0; i<starsCount; i++) {
            const r = 200 + Math.random() * 300;
            // Distribute mostly along a plane to simulate a galaxy edge, but with some vertical scatter
            const theta = Math.random() * Math.PI * 2;
            const ySpread = (Math.random() - 0.5) * 100;
            
            starsPositions[i*3] = Math.cos(theta) * r;
            starsPositions[i*3+1] = ySpread;
            starsPositions[i*3+2] = Math.sin(theta) * r;
        }
        
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.5,
            transparent: true,
            opacity: 0.6,
            sizeAttenuation: true
        });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        const clock = new THREE.Clock();

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Rotate the entire wormhole
            wormhole.rotation.y = elapsedTime * 0.1;
            
            // Update shader time for subtle internal wobbly motion
            material.uniforms.time.value = elapsedTime;

            // Slowly rotate background stars too
            starField.rotation.y = elapsedTime * 0.02;

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        window.onload = animate;
    </script>
</body>
</html>
