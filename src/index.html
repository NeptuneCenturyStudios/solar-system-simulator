<!doctype html>
<html lang="en">
    <head>
        <!--
            Google tag (gtag.js).

            Web only: the desktop build runs from a custom scheme, has no
            reportable page URL, and must not feed the site's analytics
            property. `gtag` is still defined so any call site keeps working —
            over any protocol other than http(s) the external script is simply
            never fetched.
        -->
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag('js', new Date());

            gtag('config', 'G-V5QZ955H29');

            if (location.protocol === 'http:' || location.protocol === 'https:') {
                const analyticsScript = document.createElement('script');
                analyticsScript.async = true;
                analyticsScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-V5QZ955H29';
                document.head.appendChild(analyticsScript);
            }
        </script>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Solar System Simulator</title>
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <!-- Vue UI overlay root (new UI, developed in parallel with the existing UI) -->
        <div id="vue-ui-root"></div>

        <script type="module" src="index.ts"></script>
    </body>
</html>
