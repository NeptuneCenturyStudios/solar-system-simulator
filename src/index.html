<!doctype html>
<html lang="en">
    <head>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-V5QZ955H29"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag('js', new Date());

            gtag('config', 'G-V5QZ955H29');
        </script>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Solar System Simulator</title>
        <link rel="icon" href="data:," />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <!-- Vue UI overlay root (new UI, developed in parallel with the existing UI) -->
        <div id="vue-ui-root"></div>

        <!-- Temporarily hidden while vue ui is in testing and dev -->
        <div class="new-ui toolbar-container" style="display: none">
            <!-- Top main display area -->
            <div class="ui-top">
                <!-- Left toolbar -->
                <div id="toolbar-left" class="toolbar toolbar-left">
                    <button
                        id="btn-about"
                        class="btn toolbar-btn"
                        title="About this simulator"
                        aria-label="About this simulator"
                    >
                        <span class="material-symbols-outlined">info</span>
                    </button>

                    <button
                        id="btn-donate"
                        class="btn toolbar-btn btn-care"
                        title="Support Neptune Century on Ko-fi"
                    >
                        <span class="material-symbols-outlined">favorite</span>
                    </button>

                    <button id="btn-playlist" class="btn toolbar-btn" title="Music Playlist">
                        <span class="material-symbols-outlined">music_note</span>
                    </button>

                    <button
                        id="btn-edit-solar-system"
                        class="btn toolbar-btn"
                        title="Edit Solar System"
                    >
                        <span class="material-symbols-outlined">edit</span>
                    </button>

                    <!-- <button
                        id="btn-texture-generator"
                        class="btn toolbar-btn"
                        title="Texture Generator"
                    >
                        <span class="material-symbols-outlined">texture</span>
                    </button> -->

                    <button
                        id="btn-reset"
                        class="btn toolbar-btn btn-warning"
                        title="Re-launch System"
                    >
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                </div>

                <!-- UI Panels -->
                <div id="ui-container">
                    <div id="texture-generator-panel" class="ui-panel">
                        <div class="panel-header">
                            Texture Generator
                            <button
                                id="btn-close-texture-generator-panel"
                                class="old-ui btn-danger btn-icon-only ml-auto mb-0"
                                title="Close Texture Generator"
                            >
                                <span class="material-symbols-outlined">close</span>
                            </button>
                        </div>

                        <!-- Preview -->
                        <div
                            style="
                                position: relative;
                                margin-bottom: 10px;
                                border: 1px solid var(--new-ui-border);
                                border-radius: 4px;
                                overflow: hidden;
                                background: #000;
                                line-height: 0;
                            "
                        >
                            <canvas
                                id="texture-generator-preview"
                                class="ui-canvas"
                                width="512"
                                height="256"
                                style="width: 100%; height: auto; display: block"
                            ></canvas>
                            <div
                                id="texture-gen-preview-loading"
                                style="
                                    display: none;
                                    position: absolute;
                                    inset: 0;
                                    align-items: center;
                                    justify-content: center;
                                    background: rgba(0, 0, 0, 0.55);
                                    font-size: 0.8em;
                                    color: #00ffcc;
                                "
                            >
                                <span
                                    class="material-symbols-outlined loading-icon"
                                    style="margin-right: 6px"
                                    >progress_activity</span
                                >
                                Generating…
                            </div>
                        </div>

                        <!-- Scrollable controls -->
                        <div
                            style="
                                overflow-y: auto;
                                max-height: 55vh;
                                padding-right: 2px;
                                scrollbar-width: thin;
                            "
                        >
                            <div class="control-group">
                                <label for="textureTypeSelect">Texture Type</label>
                                <select id="textureTypeSelect">
                                    <option value="gas_giant" selected>Gas Giant</option>
                                </select>
                            </div>

                            <div class="control-group">
                                <label for="textureGenSeedInput">Seed</label>
                                <div style="display: flex; gap: 6px; align-items: center">
                                    <input
                                        type="text"
                                        id="textureGenSeedInput"
                                        class="text-input"
                                        value="gas-giant"
                                        style="flex: 1 1 auto; margin-bottom: 0"
                                        placeholder="Seed string"
                                    />
                                    <button
                                        id="btn-texture-gen-randomize-seed"
                                        class="old-ui btn-icon-only"
                                        title="Randomize seed"
                                        style="flex-shrink: 0"
                                    >
                                        <span class="material-symbols-outlined">casino</span>
                                    </button>
                                </div>
                            </div>

                            <div class="control-group">
                                <label for="textureGenResolutionSelect">Resolution</label>
                                <select id="textureGenResolutionSelect">
                                    <option value="2048x1024" selected>2048 × 1024</option>
                                    <option value="4096x2048">4096 × 2048</option>
                                    <option value="8192x4096">8192 × 4096</option>
                                </select>
                            </div>

                            <div class="control-group">
                                <label for="textureGenPaletteSelect">Colour Palette</label>
                                <select id="textureGenPaletteSelect">
                                    <option value="jupiter" selected>Jupiter</option>
                                    <option value="saturn">Saturn</option>
                                    <option value="ice">Ice Giant</option>
                                    <option value="alien">Alien</option>
                                    <option value="custom">Custom</option>
                                </select>
                            </div>

                            <!-- Custom colour pickers — hidden until palette = custom -->
                            <div id="textureGenCustomColorRow" style="display: none">
                                <div class="control-group">
                                    <label>Band Colours</label>
                                    <div
                                        style="
                                            display: grid;
                                            grid-template-columns: 1fr 1fr 1fr;
                                            gap: 6px;
                                        "
                                    >
                                        <div>
                                            <div
                                                style="
                                                    font-size: 0.75em;
                                                    color: #aaa;
                                                    margin-bottom: 3px;
                                                "
                                            >
                                                Color 1
                                            </div>
                                            <input
                                                type="color"
                                                id="textureGenCustomBandColor1"
                                                value="#c2884a"
                                                style="
                                                    width: 100%;
                                                    height: 32px;
                                                    padding: 2px;
                                                    cursor: pointer;
                                                    background: transparent;
                                                    border: 1px solid var(--new-ui-border);
                                                    border-radius: 4px;
                                                "
                                            />
                                        </div>
                                        <div>
                                            <div
                                                style="
                                                    font-size: 0.75em;
                                                    color: #aaa;
                                                    margin-bottom: 3px;
                                                "
                                            >
                                                Color 2
                                            </div>
                                            <input
                                                type="color"
                                                id="textureGenCustomBandColor2"
                                                value="#4a88c2"
                                                style="
                                                    width: 100%;
                                                    height: 32px;
                                                    padding: 2px;
                                                    cursor: pointer;
                                                    background: transparent;
                                                    border: 1px solid var(--new-ui-border);
                                                    border-radius: 4px;
                                                "
                                            />
                                        </div>
                                        <div>
                                            <div
                                                style="
                                                    font-size: 0.75em;
                                                    color: #aaa;
                                                    margin-bottom: 3px;
                                                "
                                            >
                                                Color 3
                                            </div>
                                            <input
                                                type="color"
                                                id="textureGenCustomBandColor3"
                                                value="#c24a4a"
                                                style="
                                                    width: 100%;
                                                    height: 32px;
                                                    padding: 2px;
                                                    cursor: pointer;
                                                    background: transparent;
                                                    border: 1px solid var(--new-ui-border);
                                                    border-radius: 4px;
                                                "
                                            />
                                        </div>
                                    </div>
                                </div>
                                <div class="control-group">
                                    <label>Equatorial Colours</label>
                                    <div
                                        style="
                                            display: grid;
                                            grid-template-columns: 1fr 1fr 1fr;
                                            gap: 6px;
                                        "
                                    >
                                        <div>
                                            <div
                                                style="
                                                    font-size: 0.75em;
                                                    color: #aaa;
                                                    margin-bottom: 3px;
                                                "
                                            >
                                                Color 1
                                            </div>
                                            <input
                                                type="color"
                                                id="textureGenCustomEquatorialColor1"
                                                value="#6ab0e0"
                                                style="
                                                    width: 100%;
                                                    height: 32px;
                                                    padding: 2px;
                                                    cursor: pointer;
                                                    background: transparent;
                                                    border: 1px solid var(--new-ui-border);
                                                    border-radius: 4px;
                                                "
                                            />
                                        </div>
                                        <div>
                                            <div
                                                style="
                                                    font-size: 0.75em;
                                                    color: #aaa;
                                                    margin-bottom: 3px;
                                                "
                                            >
                                                Color 2
                                            </div>
                                            <input
                                                type="color"
                                                id="textureGenCustomEquatorialColor2"
                                                value="#e0a060"
                                                style="
                                                    width: 100%;
                                                    height: 32px;
                                                    padding: 2px;
                                                    cursor: pointer;
                                                    background: transparent;
                                                    border: 1px solid var(--new-ui-border);
                                                    border-radius: 4px;
                                                "
                                            />
                                        </div>
                                        <div>
                                            <div
                                                style="
                                                    font-size: 0.75em;
                                                    color: #aaa;
                                                    margin-bottom: 3px;
                                                "
                                            >
                                                Color 3
                                            </div>
                                            <input
                                                type="color"
                                                id="textureGenCustomEquatorialColor3"
                                                value="#60e090"
                                                style="
                                                    width: 100%;
                                                    height: 32px;
                                                    padding: 2px;
                                                    cursor: pointer;
                                                    background: transparent;
                                                    border: 1px solid var(--new-ui-border);
                                                    border-radius: 4px;
                                                "
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="control-group">
                                <label
                                    >Color Variation
                                    <span id="textureGenColorVariationVal" class="val-display"
                                        >1.00</span
                                    ></label
                                >
                                <div class="slider-row">
                                    <input
                                        type="range"
                                        id="textureGenColorVariationSlider"
                                        min="0"
                                        max="100"
                                        step="1"
                                        value="100"
                                        title="How much palette colours diverge from the average (0 = monochromatic, 1 = full variation)"
                                    />
                                </div>
                            </div>

                            <div class="control-group">
                                <label
                                    >Band Scale
                                    <span id="textureGenBandScaleVal" class="val-display"
                                        >8</span
                                    ></label
                                >
                                <div class="slider-row">
                                    <input
                                        type="range"
                                        id="textureGenBandScaleSlider"
                                        min="1"
                                        max="20"
                                        step="1"
                                        value="8"
                                        title="Number of horizontal band cycles"
                                    />
                                </div>
                            </div>

                            <div class="control-group">
                                <label
                                    >Turbulence
                                    <span id="textureGenTurbulenceVal" class="val-display"
                                        >0.40</span
                                    ></label
                                >
                                <div class="slider-row">
                                    <input
                                        type="range"
                                        id="textureGenTurbulenceSlider"
                                        min="0"
                                        max="100"
                                        step="1"
                                        value="40"
                                        title="How wavy or distorted the bands appear"
                                    />
                                </div>
                            </div>

                            <div class="control-group">
                                <label
                                    >Detail
                                    <span id="textureGenDetailVal" class="val-display"
                                        >0.30</span
                                    ></label
                                >
                                <div class="slider-row">
                                    <input
                                        type="range"
                                        id="textureGenDetailSlider"
                                        min="0"
                                        max="100"
                                        step="1"
                                        value="30"
                                        title="High-frequency noise within each band"
                                    />
                                </div>
                            </div>

                            <div class="control-group">
                                <label
                                    >Storm Count
                                    <span id="textureGenStormCountVal" class="val-display"
                                        >2</span
                                    ></label
                                >
                                <div class="slider-row">
                                    <input
                                        type="range"
                                        id="textureGenStormCountSlider"
                                        min="0"
                                        max="5"
                                        step="1"
                                        value="2"
                                        title="Number of oval storm features"
                                    />
                                </div>
                            </div>

                            <div class="control-group">
                                <label
                                    >Storm Size
                                    <span id="textureGenStormSizeVal" class="val-display"
                                        >0.10</span
                                    ></label
                                >
                                <div class="slider-row">
                                    <input
                                        type="range"
                                        id="textureGenStormSizeSlider"
                                        min="2"
                                        max="25"
                                        step="1"
                                        value="10"
                                        title="Relative radius of each storm"
                                    />
                                </div>
                            </div>

                            <div class="control-group">
                                <label
                                    >Contrast
                                    <span id="textureGenContrastVal" class="val-display"
                                        >1.5</span
                                    ></label
                                >
                                <div class="slider-row">
                                    <input
                                        type="range"
                                        id="textureGenContrastSlider"
                                        min="5"
                                        max="30"
                                        step="1"
                                        value="15"
                                        title="Contrast between adjacent bands"
                                    />
                                </div>
                            </div>

                            <div class="control-group">
                                <label
                                    >Equatorial Width
                                    <span id="textureGenEquatorialWidthVal" class="val-display"
                                        >0.30</span
                                    ></label
                                >
                                <div class="slider-row">
                                    <input
                                        type="range"
                                        id="textureGenEquatorialWidthSlider"
                                        min="0"
                                        max="100"
                                        step="1"
                                        value="30"
                                        title="How far from the equator the secondary colour palette extends (0 = none, 1 = full sphere)"
                                    />
                                </div>
                            </div>
                        </div>

                        <!-- Download -->
                        <div
                            style="
                                margin-top: 10px;
                                padding-top: 10px;
                                border-top: 1px solid var(--new-ui-border);
                                display: flex;
                                align-items: center;
                                gap: 8px;
                            "
                        >
                            <button
                                id="btn-texture-gen-download"
                                class="old-ui btn-with-icon"
                                style="flex: 1 1 auto"
                            >
                                <span class="material-symbols-outlined">download</span>
                                DOWNLOAD
                            </button>
                            <span
                                id="texture-gen-download-loading"
                                style="
                                    display: none;
                                    color: #00ffcc;
                                    font-size: 0.8em;
                                    white-space: nowrap;
                                    align-items: center;
                                    gap: 4px;
                                "
                            >
                                <span class="material-symbols-outlined loading-icon"
                                    >progress_activity</span
                                >
                                Rendering…
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="index.ts"></script>
    </body>
</html>
